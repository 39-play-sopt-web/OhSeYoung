<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오세영 자기소개</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <a href="#photo" class="profile-link">
          <img
            src="./images/profile.jpg"
            alt="오세영 프로필 사진"
            class="profile-image"
          />
        </a>
      </div>

      <div class="header-center">
        <h1 class="header-title">세영의 블로그</h1>
      </div>

      <div class="header-right">
        <a
          class="github-link"
          href="https://github.com/comehere43"
          target="_blank"
        >
          <img src="./images/github.png" alt="GitHub" class="github-icon" />
        </a>
      </div>
    </header>

    <div class="page-layout">
      <!-- 왼쪽 네비게이션 -->
      <nav class="navigation">
        <ul>
          <li><a href="#photo">📷 포토 덤프</a></li>
          <li><a href="#likes">좋아하는 것</a></li>
          <li><a href="#interests">내 관심사</a></li>
          <li><a href="#webtory">To.웹토리</a></li>
        </ul>
      </nav>

      <main class="main-content">
        <!-- 포토 덤프 -->
        <section id="photo" class="section">
          <h2>📷 포토 덤프</h2>

          <div class="photo-grid">
            <div class="photo-item photo-1">
              <img
                src="./images/photo1.jpg"
                alt="지하철 승강장에서 브이하는 사진"
              />
            </div>

            <div class="photo-item photo-2">
              <img
                src="./images/photo2.jpg"
                alt="친구들과 카드게임 하는 모습"
              />
            </div>

            <div class="photo-item photo-3">
              <img
                src="./images/photo3.jpg"
                alt="보랏빛 조명이 켜진 페스티벌 무대"
              />
            </div>

            <div class="photo-item photo-4">
              <img
                src="./images/photo4.jpg"
                alt="한강공원에서 친구들과 스케이트보드 타는 모습"
              />
            </div>

            <div class="photo-item photo-5">
              <img
                src="./images/photo5.jpg"
                alt="콘서트장에서 티켓 세 장을 들고 찍은 사진"
              />
            </div>

            <div class="photo-item photo-6">
              <img src="./images/photo6.jpg" alt="차 운전석에 앉아 있는 모습" />
            </div>
          </div>
        </section>

        <!-- 좋아하는 것 -->
        <section id="likes" class="section">
          <h2>좋아하는 것 💗</h2>
          <p class="likes-description">웃긴 고양이ㅋㅋ</p>

          <div class="likes-scroll">
            <!-- 첫 번째 사진 묶음 -->
            <div class="likes-set">
              <div class="likes-card">
                <img src="./images/cat1.jpg" alt="고양이 1" />
              </div>
              <div class="likes-card">
                <img src="./images/cat2.jpg" alt="고양이 2" />
              </div>
              <div class="likes-card">
                <img src="./images/cat3.jpg" alt="고양이 3" />
              </div>
              <div class="likes-card">
                <img src="./images/cat4.jpg" alt="고양이 4" />
              </div>
              <div class="likes-card">
                <img src="./images/cat5.jpg" alt="고양이 5" />
              </div>
              <div class="likes-card">
                <img src="./images/cat6.jpg" alt="고양이 6" />
              </div>
              <div class="likes-card">
                <img src="./images/cat7.jpg" alt="고양이 7" />
              </div>
              <div class="likes-card">
                <img src="./images/cat8.jpg" alt="고양이 8" />
              </div>
              <div class="likes-card">
                <img src="./images/cat9.jpg" alt="고양이 9" />
              </div>
              <div class="likes-card">
                <img src="./images/cat10.jpg" alt="고양이 10" />
              </div>
            </div>

            <!-- 무한 루프용으로 같은 사진 묶음 한 번 더 (스크린리더가 두 번 읽지 않게 aria-hidden) -->
            <div class="likes-set" aria-hidden="true">
              <div class="likes-card">
                <img src="./images/cat1.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat2.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat3.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat4.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat5.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat6.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat7.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat8.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat9.jpg" alt="" />
              </div>
              <div class="likes-card">
                <img src="./images/cat10.jpg" alt="" />
              </div>
            </div>
          </div>
        </section>

        <!-- 내 관심사 -->
        <section id="interests" class="section">
          <h2>내 관심사 😻</h2>

          <div class="interest-grid">
            <article class="interest-card">
              <img src="./images/interest1.jpg" alt="개발" />
              <h3>개발</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest2.jpg" alt="음악" />
              <h3>음악</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest3.jpg" alt="운동" />
              <h3>운동</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest4.jpg" alt="여행" />
              <h3>여행</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest5.jpg" alt="드라마" />
              <h3>드라마</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest6.jpg" alt="맛집" />
              <h3>맛집</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest7.jpg" alt="게임" />
              <h3>게임</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>

            <article class="interest-card">
              <img src="./images/interest8.jpg" alt="고양이" />
              <h3>고양이</h3>

              <div class="interest-buttons">
                <button type="button" class="like-button">좋아요</button>
                <button type="button" class="dislike-button">싫어요</button>
              </div>
            </article>
          </div>
        </section>

        <!-- To. 웹토리 -->
        <section id="webtory" class="section webtory-section">
          <h2>To. 웹토리 💚</h2>

          <div class="webtory-message">
            <p>앞으로 많이 배우고 열심히 참여하겠습니다!</p>
            <p>부족한 점도 많겠지만 하나씩 성장해갈 테니 잘 부탁드립니다 :)</p>
          </div>
        </section>
      </main>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      <p>Designed & Developed by Oh Se Young.</p>
      <small>© 2026 Se Young. All rights reserved.</small>
    </footer>
  </body>
</html>
